[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blackecho"
version = "1.0.0"
description = "Operation BlackEcho — end-to-end DFIR investigation lab across 8 defensive tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "REV3R5ED" }]
keywords = ["dfir", "incident-response", "phishing", "forensics", "integration-test"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]

[project.scripts]
blackecho = "run_blackecho:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
