name: BlackEcho CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackecho-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: python -m pip install --upgrade pip ruff
      - name: Ruff
        run: ruff check .

  evidence-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest
      - name: Generate deterministic evidence
        run: python evidence_factory.py
      - name: Prepare pipeline output directories
        run: mkdir -p normalized correlation scoring reports
      - name: Run tests available without external tool installs
        run: pytest -q -k "not pipeline_outputs_exist and not scoring_thresholds"
